name: Release agent

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi untuk build percobaan (tanpa membuat release)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node SEA menyuntikkan blob ke binary `node` milik runner, jadi
          # cross-compile mustahil — tiap target harus dibangun di arsitekturnya
          # sendiri.
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-13, target: darwin-x64 }
          - { os: macos-latest, target: darwin-arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Build
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: npm run build:agent

      - name: Sanity check
        shell: bash
        run: |
          BIN="apps/agent/dist/company-agent-${{ matrix.target }}"
          test -x "$BIN"
          # Binary harus jalan dan mengeluh soal argumen, bukan crash. Tanpa
          # langkah ini, binary rusak tetap lolos ke release dan baru ketahuan
          # setelah orang mengunduhnya.
          out=$("$BIN" bogus 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "company-agent" || {
            echo "::error::binary tidak merespons seperti yang diharapkan"; exit 1; }

      - name: Checksum
        shell: bash
        run: |
          cd apps/agent/dist
          BIN="company-agent-${{ matrix.target }}"
          if command -v sha256sum >/dev/null; then sha256sum "$BIN" > "$BIN.sha256"
          else shasum -a 256 "$BIN" > "$BIN.sha256"; fi
          cat "$BIN.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: company-agent-${{ matrix.target }}
          path: |
            apps/agent/dist/company-agent-${{ matrix.target }}
            apps/agent/dist/company-agent-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Daftar aset
        run: ls -lh artifacts

      - name: Tanam nama repo ke install.sh
        # Fork akan menerbitkan installer yang menunjuk ke repo asal kalau
        # nilainya tidak ditulis ulang di sini — curl-nya lalu mengunduh biner
        # milik orang lain, atau 404.
        run: |
          sed -i 's|REPO:-[^}]*|REPO:-${{ github.repository }}|' install.sh
          grep -n 'REPO=' install.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            install.sh
          generate_release_notes: true
          body: |
            ## Pasang

            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```

            Butuh [Claude Code](https://claude.com/download) sudah terpasang dan
            login di mesin ini — agent memakai instalasi itu, bukan memaketkan
            salinannya sendiri.

            Setelah terpasang:

            ```sh
            company-agent login    # tampilkan kode, ketik di web
            company-agent start
            ```
